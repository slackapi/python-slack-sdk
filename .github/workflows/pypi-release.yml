name: Upload A Release to pypi.org or test.pypi.org

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, do not publish)"
        required: false
        type: boolean

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          scripts/build_pypi_package.sh

      - name: Persist dist folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/

  test-pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    # Run this job for workflow_dispatch events when dry_run input is not 'true'
    # Note: The comparison is against a string value 'true' since GitHub Actions inputs are strings
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
    environment:
      name: testpypi
    permissions:
      id-token: write

    steps:
      - name: Retrieve dist folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/

      - name: Publish release distributions to test.pypi.org
        # Using OIDC for PyPI publishing (no API tokens needed)
        # See: https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-pypi
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    if: github.event_name == 'release'
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Retrieve dist folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/

      - name: Publish release distributions to pypi.org
        # Using OIDC for PyPI publishing (no API tokens needed)
        # See: https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-pypi
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  notify:
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'slackapi/python-slack-sdk'
    runs-on: ubuntu-latest
    needs:
      - pypi-publish
    permissions:
      contents: read

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          webhook: ${{ secrets.SLACK_RELEASE_ANNOUNCEMENTS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            action_url: "${{ github.event.release.html_url }}"
            message: "python-slack-sdk ${{ github.event.release.tag_name }}"
            repository: "${{ github.repository }}"
